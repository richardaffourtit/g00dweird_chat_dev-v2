services:
  - type: web
    name: g00dweird-api
    runtime: python
    rootDir: g00dweird_chat-main/backend
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    numInstances: 1
    domains:
      - api.g00dweird.com
    disk:
      name: g00dweird-uploads
      mountPath: /var/data/g00dweird/uploads
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: g00dweird
      - key: CORS_ORIGINS
        value: https://g00dweird.com,https://www.g00dweird.com,https://chat.g00dweird.com
      - key: REALTIME_MODE
        value: single-instance
      - key: OBJECT_STORAGE_PROVIDER
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /var/data/g00dweird/uploads

  - type: web
    name: g00dweird-chat
    runtime: static
    rootDir: g00dweird_chat-main/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    autoDeployTrigger: commit
    domains:
      - chat.g00dweird.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_BACKEND_URL
        value: https://api.g00dweird.com
      - key: VITE_PREVIEW_MOCK
        value: "0"
      - key: VITE_USE_CLEANED_SPRITES
        value: "1"
